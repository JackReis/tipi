[project]
name = "tipi"
version = "0.1.0"
description = "Portable fleet core — movable shelter for agentic AI coordination"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jack Reis", email = "jackareis@gmail.com" }]
dependencies = [
    "mcp>=1.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "jsonschema>=4.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tipi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
